name: Service

# Service d'Arpente (assistant IA, passerelle de connexion) : typecheck,
# tests, puis construction de l'image — sans la publier. La mise en ligne
# reste un geste à part : `sh deploy/deploy-service.sh <serveur>` construit
# l'image sur le poste, au commit courant, et l'envoie au serveur, qui ne
# compile rien.
#
# Les actions qui ne viennent pas de GitHub sont épinglées sur une empreinte
# de commit, jamais sur un tag (même versions qu'Agora).

"on":
  push:
    branches: [main]
    paths:
      - 'service/**'
      - 'utils/**'
      - 'types/**'
      - 'content/**'
      - 'docs/mcp-architecture.md'
      - '.github/workflows/service.yml'
  workflow_dispatch:

concurrency:
  group: service-arpente
  cancel-in-progress: false

jobs:
  verifier:
    name: Typecheck et tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Dépendances
        working-directory: service
        run: npm ci --ignore-scripts

      - name: Typecheck et tests
        working-directory: service
        run: npm run typecheck && npm test

  image:
    name: Image (construite, non publiée)
    needs: verifier
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v4.4.1

      - name: Construire
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v7.4.0
        with:
          context: .
          file: service/Dockerfile
          push: false
          cache-from: type=gha,scope=service
          cache-to: type=gha,mode=max,scope=service
